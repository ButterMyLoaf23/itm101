<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Firebase Starter Page</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <p class="eyebrow">Firebase + Node.js</p>
        <h1>Welcome to your Firebase page</h1>
        <p class="intro">
          This page is served from the <code>public</code> folder by a small
          Node.js server.
        </p>

        <button id="status-button" type="button">Check server status</button>
        <p id="status" class="status" aria-live="polite">
          Click the button to contact Node.js.
        </p>
      </section>
    </main>

    <script>
      const button = document.querySelector("#status-button");
      const status = document.querySelector("#status");

      button.addEventListener("click", async () => {
        button.disabled = true;
        status.textContent = "Checking...";

        try {
          const response = await fetch("/api/status");
          if (!response.ok) throw new Error("Request failed");

          const data = await response.json();
          status.textContent = `${data.message} (${data.time})`;
        } catch (error) {
          status.textContent = "Could not reach the Node.js server.";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
